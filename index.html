<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ULI - Universal LEGO Interface</title>
    
    <script src="javascript/blockly_compressed.js"></script>
    <script src="javascript/blocks_compressed.js"></script>
    <script src="javascript/python_compressed.js"></script>
    <script src="javascript/en.js"></script>
    <script src="javascript/qwebchannel.js"></script>
    <script src="blocks/blocks.js"></script>
    <script src="blocks/generator.js"></script>
    <script src="javascript/app.js"></script>

    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #333; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        #main { display: flex; flex: 1; overflow: hidden; }
        #blocklyDiv { flex: 3; height: 100%; }
        #sidePanel { flex: 1; display: flex; flex-direction: column; border-left: 2px solid #444; background: #252526; }
        .panel-box { flex: 1; padding: 10px; overflow-y: auto; border-bottom: 1px solid #444; }
        pre { font-size: 12px; color: #d4d4d4; margin: 0; white-space: pre-wrap; font-family: 'Consolas', monospace; }
        h3 { margin-top: 0; font-size: 14px; color: #007acc; text-transform: uppercase; }
        .interface-row { display: flex; gap: 5px; margin-bottom: 5px; }
        input, select, button { background: #3c3c3c; color: white; border: 1px solid #555; padding: 3px; }
        button { cursor: pointer; background: #007acc; border-radius: 2px; border: none; padding: 5px 10px; }
        button:hover { background: #005a9e; }
        #log { font-family: monospace; color: #4ec9b0; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div><strong><h1>Universal Legacy Lego IDE</strong></h1></div>
    <div>
        <button onclick="refreshPorts()">Refresh Ports</button>
        <button id="saveBtn" onclick="saveWorkspace()">Save Blocks</button>
        <button id="loadBtn" onclick="document.getElementById('fileInput').click()">Load Blocks</button>
        <input type="file" id="fileInput" style="display:none;" onchange="loadFromFile(event)">
        <button onclick="runPython()" style="background: #28a745;">RUN CODE</button>
        <button onclick="stopPython()" style="background: #ff0000;">STOP CODE</button>
	<button onclick="hardReset()" style="background: #dc3545;">Reset Hardware</button>
    </div>
</header>

<div id="main">
    <div id="blocklyDiv"></div>
    
    <div id="sidePanel">
        <div class="panel-box" id="mappingBox">
            <h3>Available Serial Ports</h3>
            <div id="interfaceContainer">
                <div class="interface-row">
                    <input type="text" class="iface-name" value="IFACE_1" style="width:80px;">
                    <select class="iface-port" style="flex-grow:1;"><option value="">Scanning...</option></select>
                </div>
            </div>
            <button onclick="addInterfaceRow()" style="margin-top:5px; width:100%; background: #444;">+ Add Interface</button>
        </div>

        <div class="panel-box" style="flex: 1.5;">
            <h3>Python Preview</h3>
            <pre id="pythonOutput"># Code will appear here...</pre>
        </div>

        <div class="panel-box" id="consolePanel">
            <h3>Status Console</h3>
            <div id="log">Ready.</div>
        </div>
    </div>
</div>

<script>
    // 1. Global Pointers
    var workspace; 
    var backend;

    // 2. The Bridge Setup (The ONLY place this should happen)
    window.addEventListener('load', () => {
        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, (channel) => {
                window.backend = channel.objects.backend;
                backend = window.backend;
                console.log("ULI Bridge Connected.");

                // Initialize Blockly
                if (typeof initIDE === 'function') initIDE();
                
                // Initial Port Scan
                refreshPorts();
            });
        }
    });

    // 3. Dedicated Port Refresher
    function refreshPorts() {
        if (window.backend && window.backend.get_serial_ports) {
            window.backend.get_serial_ports((ports) => {
                const selects = document.querySelectorAll('.iface-port');
                selects.forEach(select => {
                    const current = select.value;
                    if (Array.isArray(ports) && ports.length > 0) {
                        select.innerHTML = ports.map(p => 
                            `<option value="${p}" ${p === current ? 'selected' : ''}>${p}</option>`
                        ).join('');
                    } else {
                        select.innerHTML = '<option value="">No Devices Found</option>';
                    }
                });
            });
        }
    }

function runPython() {
    if (!window.workspace || !window.backend) return;

    // We skip the JS clear here because we'll do it in Python
    try {
        let code = python.pythonGenerator.workspaceToCode(window.workspace);
        const mapping = {};
        document.querySelectorAll('.interface-row').forEach(row => {
            const name = row.querySelector('.iface-name').value;
            const port = row.querySelector('.iface-port').value;
            if(name) mapping[name] = port;
        });

        // ADD THE CLEAR COMMAND TO THE START OF THE CODE
        // Use a special print token that your Python backend recognizes as a "Clear UI" command
        const clearCommand = "print('CLS')\n"; 

        const cleanupSuffix = `
print("--- CLEANING UP PORTS ---")
if 'ifaces' in globals():
    for name in list(ifaces.keys()):
        try:
            ifaces[name]['ser'].close()
        except: pass
    globals()['ifaces'] = {}
`;

        // Send: CLEAR + CODE + CLEANUP
        window.backend.run_with_cleanup(JSON.stringify(mapping), clearCommand + code + cleanupSuffix, function(result) {
             console.log("Sent.");
        });

    } catch (e) { console.error(e); }
}

    // 5. Row Management
    function addInterfaceRow() {
        const container = document.getElementById('interfaceContainer');
        const div = document.createElement('div');
        div.className = 'interface-row';
        div.innerHTML = `
            <input type="text" class="iface-name" value="IFACE_${container.children.length + 1}" style="width:80px;">
            <select class="iface-port" style="flex-grow:1;"><option value="">Scanning...</option></select>
            <button onclick="this.parentElement.remove()" style="background:#882222; padding:0 5px;">&times;</button>
        `;
        container.appendChild(div);
        refreshPorts(); 
    }
window.logToConsole = function(msg) {
    const log = document.getElementById('log');
    if (log) {
        // Create a new line for the message
        const newLine = document.createElement('div');
        newLine.textContent = `> ${msg}`;
        log.prepend(newLine); // Put newest messages at the top

        // Optional: Keep only the last 50 lines to prevent lag
        while (log.children.length > 50) {
            log.lastChild.remove();
        }
    }
    console.log("Python Print:", msg); // Also show in F12 console
};
window.getInterfaceMapping = function() {
    const mapping = {};
    document.querySelectorAll('.interface-row').forEach(row => {
        const name = row.querySelector('.iface-name').value;
        const port = row.querySelector('.iface-port').value;
        if(name) mapping[name] = port;
    });
    return mapping;
};
function hardReset() {
    if (!window.backend) {
        console.error("Backend not connected.");
        return;
    }

    // This is the "kill switch" Python code
    const resetCode = `
print("!!! EMERGENCY RESET TRIGGERED !!!")
if 'ifaces' in globals():
    for name in list(ifaces.keys()):
        try:
            print(f"Force closing: {name}")
            ifaces[name]['ser'].close()
        except Exception as e:
            print(f"Error closing {name}: {e}")
    # Wipe the dictionary so the next 'Run' starts fresh
    globals()['ifaces'] = {}
print("SYSTEM RESET: All ports released and ready.")
`;

    // Send the kill switch to Python
    window.backend.run_with_cleanup("{}", resetCode, function(result) {
        if (result) {
            console.log("Hard reset command executed.");
        }
    });
}

</script>
</body>
</html>
