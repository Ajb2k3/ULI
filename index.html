<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{ULI} - Pro Multi-Interface Edition</title>
    <script src="blockly_compressed.js"></script>
    <script src="blocks_compressed.js"></script>
    <script src="python_compressed.js"></script>
    <script src="en.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; background: #2c3e50; }
        #header { height: auto; min-height: 60px; padding: 10px 20px; background: #1a252f; display: flex; align-items: center; justify-content: space-between; color: white; border-bottom: 2px solid #27ae60; }
        #btnRun { padding: 10px 25px; background: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #mainContainer { display: flex; flex-grow: 1; height: calc(100vh - 75px); background: #fff; }
        #blocklyDiv { flex: 1; height: 100%; position: relative; }
        #sidebar { width: 380px; background: #ecf0f1; border-left: 1px solid #bdc3c7; display: flex; flex-direction: column; }
        #pythonOutput { flex: 1; padding: 12px; font-family: 'Courier New', monospace; font-size: 12px; background: white; white-space: pre-wrap; overflow: auto; border-bottom: 1px solid #ccc; }
        #consolePanel { height: 200px; padding: 12px; background: #2f3640; color: #44bd32; font-family: monospace; font-size: 11px; overflow-y: auto; }

        /* Multi-Interface UI Styling */
        .interface-panel { display: flex; flex-direction: column; gap: 5px; background: #2c3e50; padding: 8px; border-radius: 6px; border: 1px solid #444; margin-right: 15px; }
        .interface-row { display: flex; gap: 8px; align-items: center; }
        .iface-name { width: 80px; background: #1a252f; color: white; border: 1px solid #27ae60; border-radius: 3px; padding: 3px; font-size: 11px; text-align: center; }
        .iface-port { background: #1a252f; color: #27ae60; border: 1px solid #444; border-radius: 3px; padding: 3px; font-size: 11px; min-width: 130px; }
        .action-btn { background: #34495e; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 2px 8px; font-weight: bold; }
        .action-btn:hover { background: #27ae60; }
        .remove-btn { background: #c0392b; }
        
        .blocklyTrash { cursor: pointer; }
    </style>
</head>
<body>

    <div id="header">
        <div style="display:flex; align-items: center;">
            <strong style="margin-right: 20px;">{ULI} PRO</strong>
            
            <div class="interface-panel" id="interfaceContainer">
                <div class="interface-row">
                    <input type="text" class="iface-name" value="IFACE_1" title="Reference name for Blockly">
                    <select class="iface-port"></select>
                    <button class="action-btn" onclick="addInterfaceRow()">+</button>
                </div>
            </div>
            <button class="action-btn" onclick="refreshPorts()" style="height: 30px; margin-right: 10px;">🔄 Rescan</button>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="btnRun">RUN SCRIPT</button>
            <button id="btnReset" style="padding: 10px 15px; background: #c0392b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">NEW</button>
            <button onclick="downloadProject()" style="background-color: #ff9800; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Backup</button>
            <input type="file" id="fileInput" style="display:none;" onchange="importProject(event)">
            <button onclick="document.getElementById('fileInput').click()" style="background-color: #607d8b; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Restore</button>
        </div>
    </div>

    <div id="mainContainer">
        <div id="blocklyDiv"></div>
        <div id="sidebar">
            <div style="padding:10px; background:#dcdde1; font-size:11px; font-weight:bold;">GENERATED PYTHON</div>
            <div id="pythonOutput"></div>
            <div style="padding:10px; background:#dcdde1; font-size:11px; font-weight:bold;">HARDWARE CONSOLE</div>
            <div id="consolePanel">System Ready...<br></div>
        </div>
    </div>

    <script>
// --- 1. GLOBAL VARIABLES & CORE PATCHES ---
let workspace;
let generator;
let saveTimer = null;
let cachedPorts = [];

const originalReplace = String.prototype.replace;
String.prototype.replace = function(search, replace) {
    if (this == null) return ""; 
    return originalReplace.apply(String(this), arguments);
};

// --- 2. MULTI-INTERFACE LOGIC ---
function refreshPorts() {
    if (window.backend && window.backend.get_serial_ports) {
        window.backend.get_serial_ports((ports) => {
            cachedPorts = ports;
            document.querySelectorAll('.iface-port').forEach(select => {
                const currentVal = select.value;
                select.innerHTML = ports.length ? '' : '<option value="">No Ports Found</option>';
                ports.forEach(port => {
                    const opt = document.createElement('option');
                    opt.value = port; opt.innerHTML = port;
                    if (port === currentVal) opt.selected = true;
                    select.appendChild(opt);
                });
            });
        });
    }
}

function addInterfaceRow() {
    const container = document.getElementById('interfaceContainer');
    const index = container.children.length + 1;
    const newRow = document.createElement('div');
    newRow.className = 'interface-row';
    newRow.style.marginTop = "5px";
    newRow.innerHTML = `
        <input type="text" class="iface-name" value="IFACE_${index}">
        <select class="iface-port"></select>
        <button class="action-btn remove-btn" onclick="this.parentElement.remove()">-</button>
    `;
    container.appendChild(newRow);
    refreshPorts();
}

function getInterfaceMapping() {
    const rows = document.querySelectorAll('.interface-row');
    let map = {};
    rows.forEach(row => {
        const name = row.querySelector('.iface-name').value;
        const port = row.querySelector('.iface-port').value;
        map[name] = port;
    });
    return map;
}

// --- 3. BLOCK DEFINITIONS (REWRITTEN FOR MULTI-ID) ---
function defineCustomBlocks() {
    Blockly.defineBlocksWithJsonArray([
        {
            "type": "interface_b_init",
            "message0": "Initialise Interface: %1",
            "args0": [{ "type": "field_input", "name": "NAME", "text": "IFACE_1" }],
            "nextStatement": null, "colour": 20, "style": { "hat": "cap" }
        },
        {
            "type": "interface_b_output",
            "message0": "[%1] Motor %2 Dir %3",
            "args0": [
                { "type": "field_input", "name": "NAME", "text": "IFACE_1" },
                { "type": "field_dropdown", "name": "OUT", "options": [["A","0x01"],["B","0x02"],["C","0x04"],["D","0x08"],["E","0x10"],["F","0x20"],["G","0x40"],["H","0x80"]] },
                { "type": "field_dropdown", "name": "DIR", "options": [["Forward","0x91"],["Reverse","0x95"],["Off","0x90"],["Speed 1","0xB0"],["Speed 6","0xB7"]] }
            ],
            "previousStatement": null, "nextStatement": null, "colour": 0
        },
        {
            "type": "interface_b_read_19",
            "message0": "[%1] read data packet",
            "args0": [{ "type": "field_input", "name": "NAME", "text": "IFACE_1" }],
            "output": null, "colour": 20
        },
        {
            "type": "wait_seconds",
            "message0": "wait %1 seconds",
            "args0": [{ "type": "field_number", "name": "SEC", "value": 0.1 }],
            "previousStatement": null, "nextStatement": null, "colour": 120
        },
        {
            "type": "port_selector",
            "message0": "get %1 from data %2",
            "args0": [
                { "type": "field_dropdown", "name": "PORT", "options": [["STOP BTN", "0"], ["PORT 1", "14"], ["PORT 2", "10"], ["PORT 3", "6"], ["PORT 4", "2"]] },
                { "type": "input_value", "name": "DATA", "check": "String" }
            ],
            "output": "Number", "colour": 230
        }
    ]);
}

function setupBlockly() {
    defineCustomBlocks();
    const toolboxJson = {
        "kind": "categoryToolbox",
        "contents": [
            { "kind": "category", "name": "INTERFACES", "colour": "20", "contents": [
                { "kind": "block", "type": "interface_b_init" },
                { "kind": "block", "type": "interface_b_output" },
                { "kind": "block", "type": "interface_b_read_19" },
                { "kind": "block", "type": "port_selector" },
                { "kind": "block", "type": "wait_seconds" }
            ]},
            { "kind": "category", "name": "LOOPS", "colour": "120", "contents": [{ "kind": "block", "type": "controls_repeat_ext" }, { "kind": "block", "type": "controls_whileUntil" }]},
            { "kind": "category", "name": "LOGIC", "colour": "210", "contents": [{ "kind": "block", "type": "controls_if" }, { "kind": "block", "type": "logic_compare" }]},
            { "kind": "category", "name": "VARIABLES", "custom": "VARIABLE", "colour": "330" },
            { "kind": "category", "name": "MATH", "colour": "230", "contents": [{ "kind": "block", "type": "math_number" }, { "kind": "block", "type": "math_arithmetic" }]}
        ]
    };

    workspace = Blockly.inject('blocklyDiv', { 
        toolbox: toolboxJson, sounds: true, renderer: 'geras', media: 'media/', trashcan: true,
        zoom: { controls: true, wheel: true, startScale: 1.0 }
    });
    
    generator = python.pythonGenerator;

    // --- PRO GENERATORS ---
    generator.forBlock['interface_b_init'] = (block) => {
        const name = block.getFieldValue('NAME');
        const mapping = getInterfaceMapping();
        const port = mapping[name] || "/dev/ttyUSB0";
        return `if 'ifaces' not in globals(): ifaces = {}\n` +
               `if '${name}' not in ifaces:\n` +
               `    import serial, time\n` +
               `    ifaces['${name}'] = serial.Serial('${port}', 9600, timeout=0)\n` +
               `    ifaces['${name}'].write(b'p\\0###Do you byte, when I knock?$$$')\n` +
               `    time.sleep(0.1)\n`;
    };

    generator.forBlock['interface_b_output'] = (block) => {
        const name = block.getFieldValue('NAME');
        const dir = String(block.getFieldValue('DIR')).replace('0x', '\\x');
        const out = String(block.getFieldValue('OUT')).replace('0x', '\\x');
        return `if '${name}' in ifaces: ifaces['${name}'].write(b'${dir}${out}')\n`;
    };

    generator.forBlock['interface_b_read_19'] = (block) => {
        const name = block.getFieldValue('NAME');
        const code = `ifaces['${name}'].read(19) if ('${name}' in ifaces and ifaces['${name}'].in_waiting >= 19) else b'\\x00'*19`;
        return [code, 0];
    };

    generator.forBlock['wait_seconds'] = (block) => `import time\ntime.sleep(${block.getFieldValue('SEC')})\n`;
    
    generator.forBlock['port_selector'] = (block) => {
        const start = block.getFieldValue('PORT');
        const data = generator.valueToCode(block, 'DATA', 0) || "b'\\x00'*19";
        return [`int.from_bytes(bytes(${data})[${start}:${parseInt(start)+2}], 'big')`, 0];
    };

    // UI Listeners
    workspace.addChangeListener(() => {
        const code = generator.workspaceToCode(workspace);
        document.getElementById('pythonOutput').innerText = code;
    });

    if (typeof qt !== 'undefined') {
        new QWebChannel(qt.webChannelTransport, (channel) => {
            window.backend = channel.objects.backend;
            refreshPorts();
            window.backend.get_saved_blocks((xml) => { if(xml) Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(xml), workspace); });
        });
    }

    document.getElementById('btnRun').onclick = () => { if(window.backend) window.backend.execute_python(generator.workspaceToCode(workspace)); };
}

window.onload = setupBlockly;
    </script>
</body>
</html>
